spring.application.name=patient-management-api
server.port=8080

# ---------------------------------------------------------------------------
# Default database: H2 in-memory. No setup needed, resets on every restart.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:patientdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at http://localhost:8080/h2-console (JDBC URL above)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# To use MySQL instead, comment out the H2 block above and uncomment this:
#
# spring.datasource.url=jdbc:mysql://localhost:3306/patientdb
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#
# To use PostgreSQL instead:
#
# spring.datasource.url=jdbc:postgresql://localhost:5432/patientdb
# spring.datasource.username=postgres
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ---------------------------------------------------------------------------
